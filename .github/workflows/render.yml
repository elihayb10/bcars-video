name: render
# סרטון עדכני לכל רכב במלאי, פעמיים ביום, שעה וחצי לפני ריצות המכונה (08:00 ו-18:00 שעון ישראל בחורף).
# רק רכב חדש או שהשתנה נבנה. הסרטונים בגרסה "videos", והרשימה ב-videos.json. ראו pipeline.mjs
on:
  schedule:
    - cron: '30 4,14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['template/**', 'render.mjs', 'pipeline.mjs', 'video_data.cjs', '.github/workflows/render.yml']
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          npm install --no-audit --no-fund gsap@3.14.2
      - name: Pipeline
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AUTO360_EMAIL: ${{ secrets.AUTO360_EMAIL }}
          AUTO360_CODE: ${{ secrets.AUTO360_CODE }}
          GH_TOKEN: ${{ github.token }}
        run: node pipeline.mjs
