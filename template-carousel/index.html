<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <title>NOVEMBER SALE קרוסלה – בית הרכב</title>
    <style>
      @font-face { font-family: "Heebo"; src: url("../template-sale/assets/fonts/Heebo.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Karantina"; src: url("../template-sale/assets/fonts/Karantina-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
      /* אותו ניאון כמו בסרטון NOVEMBER SALE: ירוק מנטה, ורוד, זהב, רקע כהה */
      :root { --night: #07061a; --mint: #5dffb0; --pink: #ff3fa4; --gold: #fcb216; --gold2: #ffc83d; --ink: #fffdf7; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; font-family: "Heebo", sans-serif; color: var(--ink); width: 1080px; }
      .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
      /* כרטיס ריבועי 1080: תג NOVEMBER SALE למעלה, הרכב במרכז (התמונה המלאה מהאתר, 4:3, בלי AI, #3), שורה אחת למטה */
      .card { position: relative; width: 1080px; height: 1080px; overflow: hidden;
        background: radial-gradient(ellipse 120% 60% at 50% 45%, #1d1045 0%, #0d0828 50%, #07061a 85%); }
      .floor { position: absolute; left: -540px; width: 2160px; top: 820px; height: 700px; transform-origin: 50% 0; transform: perspective(520px) rotateX(64deg); opacity: 0.3;
        background-image: linear-gradient(rgba(255,63,164,0.9) 3px, transparent 3px), linear-gradient(90deg, rgba(93,255,176,0.75) 3px, transparent 3px); background-size: 120px 120px; }
      .fade { position: absolute; left: 0; right: 0; top: 820px; bottom: 0; background: linear-gradient(180deg, rgba(7,6,26,0) 0%, rgba(7,6,26,0.55) 60%, rgba(7,6,26,0.9) 100%); }
      .top { position: absolute; top: 34px; left: 0; right: 0; display: flex; justify-content: center; }
      .badge { display: flex; gap: 16px; align-items: baseline; direction: ltr; padding: 4px 30px 9px; border: 4px solid var(--gold); border-radius: 16px;
        background: rgba(7,6,26,0.75); box-shadow: 0 0 16px rgba(252,178,22,0.6); white-space: nowrap; }
      .nv, .sl { font-weight: 900; font-size: 50px; letter-spacing: 4px; line-height: 1.1; }
      .nv { color: #eafff4; text-shadow: 0 0 6px var(--mint), 0 0 14px var(--mint); }
      .sl { color: #fff0f8; text-shadow: 0 0 6px var(--pink), 0 0 14px var(--pink); }
      .logo { position: absolute; top: 30px; right: 34px; width: 92px; }
      .photo { position: absolute; left: 60px; top: 140px; width: 960px; height: 720px; overflow: hidden; background: #0b0a24;
        box-shadow: 0 -3px 0 rgba(255,63,164,0.9), 0 3px 0 rgba(93,255,176,0.9), 0 30px 60px rgba(0,0,0,0.55); }
      .photo img { width: 960px; height: 720px; object-fit: cover; display: block; }
      .num { position: absolute; top: 152px; left: 74px; z-index: 5; font-size: 26px; font-weight: 800; padding: 2px 14px 4px; border-radius: 999px; background: rgba(7,6,26,0.7); color: #fff; direction: ltr; }
      /* השורה: סגנון poster של הסרטון, קרנטינה לבנה עם קו מתאר ומילה מודגשת בזהב */
      .line { position: absolute; left: 40px; right: 40px; top: 880px; height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; direction: rtl; text-align: center; }
      .big { font-family: "Karantina", "Heebo", sans-serif; font-weight: 700; font-size: 112px; line-height: 0.95; color: #fff; white-space: nowrap;
        -webkit-text-stroke: 4px #000; paint-order: stroke fill; text-shadow: 0 7px 0 rgba(0,0,0,0.6), 0 14px 30px rgba(0,0,0,0.6); }
      .big b { color: var(--gold2); font-weight: 700; }
      .small { margin-top: 6px; font-size: 38px; font-weight: 800; color: #fff; white-space: nowrap; text-shadow: 0 0 10px rgba(255,63,164,0.8); }
      /* המחיר: גלולת ניאון כמו בסרטון */
      .pill { display: flex; align-items: center; gap: 24px; padding: 2px 40px 10px; border-radius: 28px; border: 5px solid var(--gold); background: rgba(7,6,26,0.92);
        box-shadow: 0 0 22px var(--pink), 0 0 50px rgba(255,63,164,0.55), inset 0 0 18px rgba(255,63,164,0.35); white-space: nowrap; }
      .pill .lbl { font-size: 40px; font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(255,63,164,0.9); }
      .pill .val { font-family: "Karantina", "Heebo", sans-serif; font-weight: 700; font-size: 110px; line-height: 1; color: #fff; text-shadow: 0 0 8px var(--gold2), 0 0 26px var(--gold); }
      .pill .val small { font-size: 0.45em; color: var(--gold2); }
      .wa { display: inline-flex; align-items: center; gap: 14px; background: var(--gold); color: #1a0a24; font-weight: 900; font-size: 56px; line-height: 1; padding: 12px 40px 16px; border-radius: 999px; direction: ltr;
        box-shadow: 0 0 22px rgba(252,178,22,0.5); }
      .wa svg { width: 50px; height: 50px; }
    </style>
  </head>
  <body>
    <div id="cards"></div>
    <script>
      // CARDS: נכתב ע"י cards.mjs. כל כרטיס: תמונה (לפי הסדר באתר) ושורה אחת
      const C = /*CARDS*/{"plate":"","cards":[]}/*CARDS*/;
      const WA = '<svg viewBox="0 0 32 32"><path fill="#1a0a24" d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3zm0 23.4c-2.1 0-4.1-.6-5.9-1.6l-.4-.3-3.8 1.2 1.2-3.7-.3-.4c-1.2-1.8-1.8-3.8-1.8-5.9C5 9.9 9.9 5.1 16 5.1S27 9.9 27 15.8 22.1 26.4 16 26.4zm6-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.3-.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.7s1.2 3.1 1.4 3.4c.2.2 2.4 3.6 5.8 5 .8.3 1.4.5 1.9.7.8.3 1.5.2 2.1.1.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>';
      const root = document.getElementById("cards");
      C.cards.forEach((k, i) => {
        let body = "";
        if (k.kind === "price") body = `<div class="pill"><span class="lbl">מחיר NOVEMBER SALE</span><span class="val"><span class="ltr">${k.price}</span>${k.vat ? " <small>+ מע״מ</small>" : ""}</span></div>`;
        else if (k.kind === "wa") body = `<div class="wa">${WA}<span>04-640-1666</span></div><div class="small">${k.sub || ""}</div>`;
        else body = `<div class="big">${k.big}</div>${k.sub ? `<div class="small">${k.sub}</div>` : ""}`;
        root.insertAdjacentHTML("beforeend", `<div class="card" id="c${i + 1}"><div class="floor"></div><div class="fade"></div>
          <div class="top"><div class="badge"><span class="nv">NOVEMBER</span><span class="sl">SALE</span></div></div>
          <img class="logo" src="../template-sale/assets/brand/logo-white.png" alt="">
          <div class="photo"><img src="${k.img}" alt=""></div>
          <div class="line">${body}</div></div>`);
      });
      // שורה שלא נכנסת ברוחב: מקטינים עד שנכנסת
      document.fonts.ready.then(() => {
        for (const el of document.querySelectorAll(".big, .pill, .small")) { let sz = parseFloat(getComputedStyle(el).fontSize);
          while (el.getBoundingClientRect().width > 1000 && sz > 30) { sz -= 2; el.style.fontSize = sz + "px"; if (el.classList.contains("pill")) { el.querySelector(".val").style.fontSize = sz * 2.6 + "px"; } } }
        document.body.dataset.ready = "1";
      });
    </script>
  </body>
</html>
